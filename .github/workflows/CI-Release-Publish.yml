name: Build-Publish
env:
  SDK_NAME: photoniq-eds-sdk
permissions:
  contents: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the lib to npmjs.org"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - master
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .github/**
      - docs/**

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
          os: [ubuntu-latest]
          node: [20]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx tsc
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SDK_NAME }}
          path: dist/
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish == 'true' }}
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SDK_NAME }}
          path: dist/
      - name: List package files
        run: ls -R ./dist
        shell: bash
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          npm publish --access public
